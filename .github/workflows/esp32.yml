name: ESP32 firmware

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build waveshare-s3-epaper-154
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0.1
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: waveshare-s3-epaper-154
            target: esp32s3
            overlays: ";devices/sdkconfig.waveshare-s3-epaper-154"
    defaults:
      run:
        shell: bash
        working-directory: esp32
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build
        env:
          TARGET: ${{ matrix.target }}
          DEFAULTS: sdkconfig.defaults${{ matrix.overlays }}
        run: |
          . "$IDF_PATH/export.sh" > /dev/null
          idf.py -B build -DIDF_TARGET="$TARGET" -DSDKCONFIG=build/sdkconfig \
            -DSDKCONFIG_DEFAULTS="$DEFAULTS" build

      - name: Package for the web flasher
        id: package
        env:
          BOARD: ${{ matrix.board }}
        run: |
          NAME=$(python3 -c 'import json, os; print(next((b["name"] for b in json.load(open("../web-flasher/boards.json")) if b["board"] == os.environ["BOARD"]), ""))')
          python3 ../web-flasher/make_manifest.py build "out/$BOARD" \
            "Muse Gadget ($NAME)" "$(cat version.txt)+${GITHUB_SHA::7}"

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.board }}
          path: esp32/out/
          if-no-files-found: error
          retention-days: 7
